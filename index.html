<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zain's Repo — Pages</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0c0c0c;
      color: #e8e4dc;
      font-family: 'Georgia', 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem 6rem;
    }

    body.unlocked { justify-content: flex-start; }

    /* ── Lock screen ── */
    #lock-screen {
      text-align: center;
      width: 100%;
      max-width: 360px;
    }

    #lock-screen .icon { font-size: 2rem; margin-bottom: 1.2rem; }

    #lock-screen h1 {
      font-size: 1.3rem;
      font-weight: normal;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f0ebe0;
      margin-bottom: 0.4rem;
    }

    #lock-screen p {
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: #555;
      margin-bottom: 2rem;
      letter-spacing: 0.08em;
    }

    #lock-screen input {
      width: 100%;
      padding: 0.7rem 1rem;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e8e4dc;
      font-size: 0.95rem;
      font-family: 'Courier New', monospace;
      outline: none;
      transition: border-color 0.15s;
    }

    #lock-screen input:focus { border-color: #555; }

    #lock-screen button {
      margin-top: 0.6rem;
      width: 100%;
      padding: 0.7rem;
      background: #e8e4dc;
      color: #0c0c0c;
      border: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    #lock-screen button:hover { opacity: 0.85; }

    #lock-error {
      margin-top: 0.75rem;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      color: #c0624a;
      display: none;
    }

    /* ── Unlocked / page listing ── */
    #app {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: normal;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #f0ebe0;
    }

    header p {
      margin-top: 0.6rem;
      font-size: 0.85rem;
      color: #666;
      letter-spacing: 0.12em;
      font-family: 'Courier New', monospace;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #333;
      margin: 1.5rem auto 0;
    }

    #page-list {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .page-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      text-decoration: none;
      color: #c8c2b4;
      background: #111;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .page-link:hover {
      background: #161616;
      border-color: #333;
      color: #f0ebe0;
    }

    .page-link:hover .arrow { opacity: 1; transform: translateX(0); }

    .page-name {
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      letter-spacing: 0.04em;
    }

    .page-name span.ext { color: #444; }

    .arrow {
      font-size: 0.85rem;
      color: #555;
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.15s, transform 0.15s;
    }

    .state {
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 2.5rem;
      font-family: 'Courier New', monospace;
      font-size: 0.82rem;
      color: #555;
      border: 1px dashed #222;
      border-radius: 6px;
    }

    .state.error { color: #c0624a; border-color: #2a1a17; }

    .dot-anim::after {
      content: '';
      animation: dots 1.2s infinite;
    }

    @keyframes dots {
      0%   { content: '.'; }
      33%  { content: '..'; }
      66%  { content: '...'; }
    }

    footer {
      margin-top: 4rem;
      font-family: 'Courier New', monospace;
      font-size: 0.75rem;
      color: #333;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

  <!-- Lock screen -->
  <div id="lock-screen">
    <div class="icon">🔒</div>
    <h1>Zain's repo</h1>
    <p>enter password to continue</p>
    <input type="password" id="pw" placeholder="password" autofocus
           onkeydown="if(event.key==='Enter') unlock()" />
    <button onclick="unlock()">unlock</button>
    <div id="lock-error">incorrect password — try again</div>
  </div>

  <!-- Unlocked app -->
  <div id="app">
    <header>
      <h1>Zain's repo</h1>
      <p>Pages index</p>
      <div class="divider"></div>
    </header>
    <div id="page-list">
      <div class="state"><span class="dot-anim">Fetching pages</span></div>
    </div>
    <footer id="footer"></footer>
  </div>

  <script>
    // ── Configuration ──────────────────────────────────────────
    const PASSWORD_HASH = '9cb66d76815f19ab04c0b058e76df96fc46a90818511286fea3bcaa7e3cbbcbe'; // generated below
    const REPO_OWNER    = 'fleekreq';
    const REPO_NAME     = 'fleekreq.github.io';
    // ───────────────────────────────────────────────────────────

    function unlock() {
      const pw = document.getElementById('pw').value;
      if (!pw) return;

      const hash = CryptoJS.SHA256(pw).toString();
      if (hash !== PASSWORD_HASH) {
        document.getElementById('lock-error').style.display = 'block';
        document.getElementById('pw').value = '';
        document.getElementById('pw').focus();
        return;
      }

      // Correct — swap screens
      document.getElementById('lock-screen').style.display = 'none';
      const app = document.getElementById('app');
      app.style.display = 'flex';
      document.body.classList.add('unlocked');
      loadPages();
    }

    async function loadPages() {
      const list   = document.getElementById('page-list');
      const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
      const baseUrl= `https://${REPO_OWNER}.github.io/`;

      try {
        const res = await fetch(apiUrl, {
          headers: { 'Accept': 'application/vnd.github.v3+json' }
        });

        if (!res.ok) throw new Error(`GitHub API responded with ${res.status}`);

        const files = await res.json();
        const pages = files.filter(f =>
          f.type === 'file' &&
          f.name.endsWith('.html') &&
          f.name.toLowerCase() !== 'index.html'
        );

        if (pages.length === 0) {
          list.innerHTML = '<div class="state">No other pages found in this repository.</div>';
          return;
        }

        list.innerHTML = pages.map(f => {
          const baseName    = f.name.replace(/\.html$/, '');
          const displayName = baseName.replace(/[-_]/g, ' ');
          return `
            <a class="page-link" href="${baseUrl}${f.name}" target="_blank" rel="noopener">
              <span class="page-name">${displayName}<span class="ext">.html</span></span>
              <span class="arrow">&#8599;</span>
            </a>`;
        }).join('');

        document.getElementById('footer').textContent =
          'fetched ' + new Date().toUTCString().toLowerCase();

      } catch (err) {
        list.innerHTML = `<div class="state error">Could not load pages: ${err.message}</div>`;
      }
    }
  </script>

</body>
</html>
