<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
<title>Protected Page</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0f0f;font-family:system-ui,sans-serif}
  .box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:2.5rem 2rem;width:100%;max-width:380px;text-align:center}
  .icon{font-size:2rem;margin-bottom:1rem}
  h1{color:#fff;font-size:1.1rem;font-weight:500;margin-bottom:0.4rem}
  p{color:#888;font-size:0.85rem;margin-bottom:1.5rem}
  input{width:100%;padding:0.65rem 1rem;border-radius:8px;border:1px solid #333;background:#111;color:#fff;font-size:0.95rem;outline:none;transition:border .2s}
  input:focus{border-color:#555}
  button{margin-top:0.75rem;width:100%;padding:0.65rem;border-radius:8px;border:none;background:#fff;color:#000;font-size:0.95rem;font-weight:500;cursor:pointer;transition:opacity .2s}
  button:hover{opacity:0.85}
  .err{margin-top:0.75rem;color:#f87171;font-size:0.82rem;display:none}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔒</div>
  <h1>Protected page</h1>
  <p>Enter the password to continue</p>
  <input type="password" id="pw" placeholder="Password" autofocus onkeydown="if(event.key==='Enter')unlock()" />
  <button onclick="unlock()">Unlock</button>
  <div class="err" id="err">Incorrect password. Try again.</div>
</div>
<script>
const ENCRYPTED = "U2FsdGVkX1+eDYXHOOwzHZBWbpG4aqM6VETHeyNIblAuVbHyAAre996u9Vz3JP6mT2hIQVUR9HqJ7xxq1GngWJglTFFBkDrv5uJUtZD+vmC/akuo6CHwhf06YzcjFamYFCZoqsKgS9Ebr2cdxNeJ+zHRXRR27PtEVjgAFWgb+ZpoY12TtVcgknoce62sh/3FabtimzVD4j3ncpQpNRGGG6v3z8hq9NEHETupgNvIAY6l8jzxVXBpHHUhCS9zP3NGyIpuoAaJYuhiSYdcPhXL9XRZs5Tpw4RnI/CorakWn7at3w40V4txkgphLznz0Ntu";
function unlock() {
  const pw = document.getElementById('pw').value;
  if (!pw) return;
  try {
    const bytes = CryptoJS.AES.decrypt(ENCRYPTED, pw);
    const html = bytes.toString(CryptoJS.enc.Utf8);
    if (!html) throw new Error('empty');
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
</script>
</body>
</html>
